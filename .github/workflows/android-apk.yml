name: Build Parent App APK

# Builds the BFHS Parent Android app and publishes the APK as a downloadable
# artifact. Runs on any change to the app, and can always be started by hand
# from the Actions tab ("Run workflow").
#
# GitHub's ubuntu runners already ship the Android SDK and JDK 17, which is
# what makes this possible at all — the app needs JDK 17+ (Gradle 8.13 / AGP 8)
# and a full Android SDK, so it cannot be built on a machine that only has
# Java 8 and no SDK installed.

on:
  push:
    branches: [main]
    paths:
      - "BFHS Parent App/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "BFHS Parent App/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "BFHS Parent App"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Compiles Kotlin and runs the unit tests. This is the gate that catches
      # a broken build before an APK is ever produced.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Rename APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/out/bfhs-parent-debug-${GITHUB_SHA::7}.apk"

      # Installable as-is: a debug APK is signed with the standard Android debug
      # key, so it sideloads onto any phone with "Install unknown apps" enabled.
      # A Play Store upload needs a release build signed with your own keystore
      # (see the release job below).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfhs-parent-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: "BFHS Parent App/app/build/reports/tests/"
          if-no-files-found: ignore

  # Signed, minified release build — only runs when a keystore has actually been
  # configured, so the workflow never fails for someone who hasn't set it up.
  # To enable: add repository secrets ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: "BFHS Parent App"

    steps:
      - uses: actions/checkout@v4

      - name: Check whether a keystore is configured
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret set — skipping the signed release build."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.check.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.check.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.check.outputs.configured == 'true'
        env:
          BFHS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BFHS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BFHS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BFHS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bfhs-parent-release-apk
          path: "BFHS Parent App/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 90
